<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品目錄 - 購物車結算系統</title>
  <style>
    :root {
      --accent: #1a5fb4;
      --accent-dark: #154a8a;
      --border: #d5d9e0;
      --muted: #6b7280;
      --error-bg: #fdecea;
      --success-bg: #e8f5e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1rem;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      color: #1f2933;
      background-color: #f7f8fa;
    }

    header {
      max-width: 960px;
      margin: 0 auto 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
    }

    header p {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* 查詢框:置於頁面頂部 */
    .search-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .search-box__label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .search-box input {
      width: 100%;
      max-width: 480px;
      padding: 0.6rem 0.9rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 2rem;
      background-color: #ffffff;
      color: #1f2933;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    /* 分類導引欄:查詢框下方的一排可點擇分頁 */
    .category-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .category-tabs__item {
      flex: 0 0 auto;
      padding: 0.45rem 1.1rem;
      font-size: 0.95rem;
      color: var(--accent);
      background-color: #ffffff;
      border: 1px solid var(--accent);
      border-radius: 2rem;
      cursor: pointer;
    }

    .category-tabs__item:hover {
      background-color: #eaf1fb;
    }

    /* 目前選中的分類以實心色塊標示 */
    .category-tabs__item--active {
      color: #ffffff;
      background-color: var(--accent);
      border-color: var(--accent);
    }

    /* 商品卡片 grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background-color: #ffffff;
    }

    /* 品項圖片:以品類顏色 + 品名首字組成的佔位圖 */
    .product-image {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 4 / 3;
      margin-bottom: 0.6rem;
      border-radius: 0.35rem;
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 700;
      user-select: none;
    }

    .product-card__name {
      margin: 0 0 0.35rem;
      font-size: 1rem;
      line-height: 1.4;
    }

    .product-card__price {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-dark);
      font-variant-numeric: tabular-nums;
    }

    /* 數量調整:- [數量] +,置於加入購物車按鈕之上 */
    .quantity-stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .quantity-stepper__button {
      width: 2rem;
      height: 2rem;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--accent);
      background-color: #ffffff;
      border: 1px solid var(--accent);
      border-radius: 0.35rem;
      cursor: pointer;
    }

    .quantity-stepper__button:hover:not(:disabled) {
      background-color: #eaf1fb;
    }

    .quantity-stepper__button:disabled {
      color: #c0c6cf;
      border-color: #c0c6cf;
      cursor: not-allowed;
    }

    .quantity-stepper__value {
      min-width: 2rem;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .product-card__button {
      margin-top: auto;
      width: 100%;
      padding: 0.5rem;
      font-size: 0.95rem;
      color: #ffffff;
      background-color: var(--accent);
      border: none;
      border-radius: 0.35rem;
      cursor: pointer;
    }

    .product-card__button:hover {
      background-color: var(--accent-dark);
    }

    .status {
      padding: 1rem;
      text-align: center;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .error {
      padding: 1rem;
      border: 1px solid #f5c6cb;
      border-radius: 0.5rem;
      background-color: var(--error-bg);
      color: #842029;
      grid-column: 1 / -1;
    }

    .error h2 {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      color: #842029;
    }

    .error p {
      margin: 0 0 0.5rem;
    }

    .error p:last-child {
      margin-bottom: 0;
    }

    /* 右下角懸浮購物車按鈕:固定在畫面上,不隨捲動消失 */
    .cart-fab {
      position: fixed;
      right: 1.5rem;
      bottom: 1.5rem;
      width: 3.5rem;
      height: 3.5rem;
      font-size: 1.6rem;
      color: #ffffff;
      background-color: var(--accent);
      border: none;
      border-radius: 50%;
      box-shadow: 0 0.25rem 0.6rem rgba(0, 0, 0, 0.28);
      cursor: pointer;
      z-index: 100;
    }

    .cart-fab:hover {
      background-color: var(--accent-dark);
    }

    /* 購物車內商品總數的角標 */
    .cart-fab__badge {
      position: absolute;
      top: -0.35rem;
      right: -0.35rem;
      min-width: 1.4rem;
      height: 1.4rem;
      padding: 0 0.3rem;
      font-size: 0.8rem;
      line-height: 1.4rem;
      color: #ffffff;
      background-color: #d93025;
      border-radius: 0.7rem;
    }

    .cart-fab__badge--hidden {
      display: none;
    }

    /* 獨立結帳頁:點開懸浮鈕後取代整個目錄畫面 */
    .checkout-view {
      max-width: 960px;
      margin: 0 auto;
    }

    .checkout-view[hidden] {
      display: none;
    }

    .checkout-view__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .checkout-view__title {
      margin: 0;
      font-size: 1.4rem;
    }

    .checkout-view__back {
      padding: 0.4rem 0.9rem;
      font-size: 0.9rem;
      color: var(--accent);
      background-color: #ffffff;
      border: 1px solid var(--accent);
      border-radius: 2rem;
      cursor: pointer;
    }

    .checkout-view__back:hover {
      background-color: #eaf1fb;
    }

    /* 結帳頁版面:左側明細 / 右側結帳與優惠券 */
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      align-items: start;
    }

    .checkout-items {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background-color: #ffffff;
    }

    .checkout-items__empty {
      margin: 0;
      padding: 1.5rem 0;
      text-align: center;
      color: var(--muted);
    }

    .checkout-item {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px dashed var(--border);
    }

    .checkout-item:last-child {
      border-bottom: none;
    }

    .checkout-item__name {
      font-size: 1rem;
    }

    .checkout-item__unit {
      margin-top: 0.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .checkout-item__lineTotal {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* 右側結帳欄:優惠券選擇與金額明細 */
    .checkout-aside {
      position: sticky;
      top: 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background-color: #ffffff;
    }

    .checkout-aside h2 {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
    }

    .coupon-list {
      margin-top: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .coupon-card {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      width: 100%;
      padding: 0.55rem 0.7rem;
      font-size: 0.9rem;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      background-color: #ffffff;
      color: #1f2933;
      cursor: pointer;
    }

    .coupon-card:hover:not(:disabled):not(.coupon-card--selected) {
      border-color: var(--accent);
    }

    .coupon-card--selected {
      border: 2px solid var(--accent);
      background-color: #eef4fc;
    }

    .coupon-card:disabled {
      color: var(--muted);
      background-color: #f5f6f7;
      cursor: not-allowed;
    }

    .coupon-card__name {
      font-weight: 600;
    }

    .coupon-card__meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .coupon-card__status {
      font-size: 0.78rem;
    }

    .coupon-card:not(:disabled) .coupon-card__status {
      color: #2e7d32;
    }

    .coupon-card:disabled .coupon-card__status {
      color: #842029;
    }

    .coupon-note {
      margin: 0.5rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .coupon-note--warn {
      color: #842029;
    }

    .amount-list {
      margin: 0.75rem 0 0;
      padding: 0;
      list-style: none;
    }

    .amount-list__row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      font-size: 0.9rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .amount-list__row span:last-child {
      color: #1f2933;
    }

    .amount-list__row--promotion span {
      color: #2e7d32;
    }

    .amount-list__total {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      padding-top: 0.6rem;
      border-top: 2px solid var(--accent);
      font-weight: 700;
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
    }

    .checkout-aside__button {
      width: 100%;
      margin-top: 0.85rem;
      padding: 0.6rem;
      font-size: 1rem;
      color: #ffffff;
      background-color: var(--accent);
      border: none;
      border-radius: 0.35rem;
      cursor: pointer;
    }

    .checkout-aside__button:hover:not(:disabled) {
      background-color: var(--accent-dark);
    }

    .checkout-aside__button:disabled {
      background-color: #c0c6cf;
      cursor: not-allowed;
    }

    .checkout-status {
      margin-top: 0.75rem;
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 0.35rem;
      background-color: var(--success-bg);
      color: #1b5e20;
    }

    .checkout-status--error {
      background-color: var(--error-bg);
      color: #842029;
    }

    .checkout-status[hidden] {
      display: none;
    }

    /* 加入購物車的提示:短暫顯示後自動消失 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      transform: translateX(-50%);
      padding: 0.7rem 1.2rem;
      font-size: 0.95rem;
      color: #ffffff;
      background-color: #1f2933;
      border-radius: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
      z-index: 200;
    }

    .toast--visible {
      opacity: 1;
    }

    /* 可見的鍵盤 focus 樣式 */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      border-radius: 0.25rem;
    }

    @media (max-width: 760px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }

      .checkout-aside {
        position: static;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }

      header h1 {
        font-size: 1.3rem;
      }

      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 0.6rem;
      }

      .product-image {
        font-size: 2rem;
      }

      .product-card {
        padding: 0.6rem;
      }

      .cart-fab {
        right: 1rem;
        bottom: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>商品目錄</h1>
    <p>依品類瀏覽全部 18 項商品</p>
    <div class="search-box">
      <label class="search-box__label" for="search-input">搜尋商品</label>
      <input type="search" id="search-input" placeholder="輸入商品名稱進行搜尋" autocomplete="off">
    </div>
  </header>

  <main id="catalog">
    <nav class="category-tabs" id="category-tabs" aria-label="商品品類"></nav>
    <div class="product-grid" id="product-grid">
      <p class="status">載入商品中…</p>
    </div>
  </main>

  <!-- 獨立結帳頁:點開購物車後整頁切換到這裡 -->
  <section class="checkout-view" id="checkout-view" hidden aria-label="結帳頁面">
    <div class="checkout-view__header">
      <h2 class="checkout-view__title">結帳</h2>
      <button class="checkout-view__back" id="checkout-back" type="button">繼續購物</button>
    </div>
    <div class="checkout-layout">
      <div class="checkout-items" id="checkout-items"></div>
      <aside class="checkout-aside" aria-label="結帳金額與優惠券">
        <h2>結帳金額</h2>
        <p class="search-box__label" id="coupon-list-label">本次優惠券(僅可用的可點選)</p>
        <div class="coupon-list" id="coupon-list" role="group" aria-labelledby="coupon-list-label"></div>
        <p class="coupon-note" id="coupon-note"></p>
        <ul class="amount-list" id="amount-list"></ul>
        <div class="amount-list__total" id="amount-total"></div>
        <button class="checkout-aside__button" id="checkout-submit" type="button">確認結帳</button>
        <p class="checkout-status" id="checkout-status" hidden></p>
      </aside>
    </div>
  </section>

  <button class="cart-fab" id="cart-fab" type="button" aria-label="開啟結帳頁面">
    🛒
    <span class="cart-fab__badge cart-fab__badge--hidden" id="cart-fab__badge">0</span>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // 目前頁面的狀態:全部商品、品類順序、選中的分類、搜尋關鍵字
    const state = {
      allProducts: [],
      categoryNames: [],
      category: "全部",
      keyword: "",
    };

    // 每個品類對應的佔位圖顏色
    const CATEGORY_COLORS = {
      "電子": "#1a5fb4",
      "食品": "#2e7d32",
      "日用品": "#e65100",
      "酒類": "#6a1b9a",
    };

    // 每張卡片目前調整到的數量,品名為鍵;未設定時預設為 1
    const quantities = {};

    // 購物車內容,品名為鍵,值含單價字串與數量;目前先存在前端記憶體
    const cart = {};

    // 後端撈回來的優惠券可選清單(含可用狀態)與目前選中的券;結算前不得視為可用
    let couponOptions = [];
    let selectedCouponId = null;

    // 目前使用的提示計時器,用來在重複點擊時取消上一次的隱藏排程
    let toastTimer = null;

    // 從後端取得商品資料;失敗時拋出錯誤,由呼叫端處理
    async function fetchProducts() {
      const response = await fetch("/api/products");
      if (!response.ok) {
        throw new Error("伺服器回應 HTTP " + response.status);
      }
      return response.json();
    }

    // 把後端依品類分組的資料攤平成單一清單,並在每筆商品上補所屬品類;
    // 同時記下品類順序,供導引欄使用
    function flattenProducts(groups) {
      const allProducts = [];
      const categoryNames = [];
      for (const group of groups) {
        categoryNames.push(group.category);
        for (const product of group.products) {
          allProducts.push({
            name: product.name,
            price: product.price,
            category: group.category,
          });
        }
      }
      return { allProducts: allProducts, categoryNames: categoryNames };
    }

    // 判斷商品是否屬於目前選中的分類;「全部」表示不限制
    function matchesCategory(product, category) {
      return category === "全部" || product.category === category;
    }

    // 判斷商品名稱是否包含搜尋關鍵字(不分大小寫)
    function matchesKeyword(product, keyword) {
      if (keyword === "") {
        return true;
      }
      return product.name.toLowerCase().includes(keyword.toLowerCase());
    }

    // 依目前選中的分類與關鍵字過濾商品
    function filterProducts() {
      const filtered = [];
      for (const product of state.allProducts) {
        if (!matchesCategory(product, state.category)) {
          continue;
        }
        if (!matchesKeyword(product, state.keyword)) {
          continue;
        }
        filtered.push(product);
      }
      return filtered;
    }

    // 組出查詢框下方的分類導引欄,品類順序沿用後端回傳的順序
    function renderCategoryTabs() {
      const tabs = document.getElementById("category-tabs");
      const categoryNames = ["全部"].concat(state.categoryNames);
      tabs.replaceChildren();
      for (const categoryName of categoryNames) {
        tabs.appendChild(buildCategoryTab(categoryName));
      }
    }

    // 組出導引欄的單一分頁;點擊後切換目前分類,並清掉搜尋關鍵字
    function buildCategoryTab(categoryName) {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "category-tabs__item";
      tab.textContent = categoryName;
      if (categoryName === state.category) {
        tab.classList.add("category-tabs__item--active");
      }
      tab.addEventListener("click", function () {
        state.category = categoryName;
        state.keyword = "";
        document.getElementById("search-input").value = "";
        renderCategoryTabs();
        renderProductGrid();
      });
      return tab;
    }

    // 組出單一商品卡片(佔位圖 + 品名 + 價格 + 數量調整 + 加入購物車按鈕)
    function buildProductCard(product) {
      const card = document.createElement("article");
      card.className = "product-card";

      const image = buildProductImage(product);
      const name = document.createElement("h3");
      name.className = "product-card__name";
      name.textContent = product.name;
      const price = document.createElement("p");
      price.className = "product-card__price";
      price.textContent = product.price + " 元";
      const stepper = buildQuantityStepper(product);
      const button = buildAddToCartButton(product);

      card.append(image, name, price, stepper, button);
      return card;
    }

    // 組出品項圖片:以品類顏色為底,中間顯示品名首字
    function buildProductImage(product) {
      const image = document.createElement("div");
      image.className = "product-image";
      image.style.backgroundColor = CATEGORY_COLORS[product.category] || "#6b7280";
      image.textContent = product.name.charAt(0);
      return image;
    }

    // 取得某商品目前調整到的數量;未調整過為 1
    function getQuantity(productName) {
      return quantities[productName] || 1;
    }

    // 組出數量調整元件(- [數量] +),數量最低為 1
    function buildQuantityStepper(product) {
      const stepper = document.createElement("div");
      stepper.className = "quantity-stepper";

      const minusButton = document.createElement("button");
      minusButton.type = "button";
      minusButton.className = "quantity-stepper__button";
      minusButton.textContent = "−";
      minusButton.setAttribute("aria-label", "減少 " + product.name + " 的數量");

      const value = document.createElement("span");
      value.className = "quantity-stepper__value";
      value.textContent = getQuantity(product.name);

      const plusButton = document.createElement("button");
      plusButton.type = "button";
      plusButton.className = "quantity-stepper__button";
      plusButton.textContent = "+";
      plusButton.setAttribute("aria-label", "增加 " + product.name + " 的數量");

      minusButton.addEventListener("click", function () {
        const current = getQuantity(product.name);
        if (current <= 1) {
          return;
        }
        quantities[product.name] = current - 1;
        updateStepper(product.name, value, minusButton);
      });

      plusButton.addEventListener("click", function () {
        const current = getQuantity(product.name);
        quantities[product.name] = current + 1;
        updateStepper(product.name, value, minusButton);
      });

      updateStepper(product.name, value, minusButton);

      stepper.append(minusButton, value, plusButton);
      return stepper;
    }

    // 更新數量顯示,並在數量為 1 時停用減號鈕
    function updateStepper(productName, value, minusButton) {
      const current = getQuantity(productName);
      value.textContent = current;
      minusButton.disabled = current <= 1;
    }

    // 組出加入購物車按鈕;點擊後把目前數量加進購物車並顯示提示
    function buildAddToCartButton(product) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "product-card__button";
      button.textContent = "加入購物車";
      button.addEventListener("click", function () {
        addToCart(product);
        showCartToast(product.name, getQuantity(product.name));
      });
      return button;
    }

    // 把商品依目前數量加進購物車;已有同品項則累加數量
    function addToCart(product) {
      const quantity = getQuantity(product.name);
      const existing = cart[product.name];
      if (existing) {
        existing.qty = existing.qty + quantity;
      } else {
        cart[product.name] = {
          name: product.name,
          price: product.price,
          qty: quantity,
        };
      }
      renderCartBadge();
    }

    // 把價格字串(如 "2399.00")換算成整數分,避免 float 小數誤差
    function priceToCents(priceText) {
      const parts = priceText.split(".");
      const dollars = Number.parseInt(parts[0], 10) || 0;
      let cents = 0;
      if (parts.length > 1) {
        const fraction = parts[1].padStart(2, "0").slice(0, 2);
        cents = Number.parseInt(fraction, 10) || 0;
      }
      return dollars * 100 + cents;
    }

    // 把整數分換回價格字串(如 "2399.00")
    function centsToText(cents) {
      const dollars = Math.floor(cents / 100);
      const fraction = (cents % 100).toString().padStart(2, "0");
      return dollars + "." + fraction;
    }

    // 計算購物車內商品的總件數(角標用)
    function calculateCartCount() {
      let count = 0;
      for (const productName of Object.keys(cart)) {
        count = count + cart[productName].qty;
      }
      return count;
    }

    // 更新懸浮鈕上的商品總數角標;總數為 0 時隱藏
    function renderCartBadge() {
      const badge = document.getElementById("cart-fab__badge");
      const count = calculateCartCount();
      badge.textContent = count;
      badge.classList.toggle("cart-fab__badge--hidden", count === 0);
    }

    // 顯示「已加入購物車」的提示,2 秒後自動消失
    function showCartToast(productName, quantity) {
      const toast = document.getElementById("toast");
      toast.textContent = "已加入購物車:" + productName + " × " + quantity;
      toast.classList.add("toast--visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove("toast--visible");
      }, 2000);
    }

    // 顯示過濾後的商品;查無商品時顯示提示
    function renderProductGrid() {
      const grid = document.getElementById("product-grid");
      const filtered = filterProducts();
      if (filtered.length === 0) {
        renderEmpty(grid);
        return;
      }
      grid.replaceChildren();
      for (const product of filtered) {
        grid.appendChild(buildProductCard(product));
      }
    }

    // 顯示查無商品的提示
    function renderEmpty(container) {
      const message = document.createElement("p");
      message.className = "status";
      message.textContent = "查無符合的商品";
      container.replaceChildren(message);
    }

    // 顯示載入失敗的訊息與排除方式
    function renderError(container, error) {
      container.replaceChildren();

      const box = document.createElement("div");
      box.className = "error";

      const title = document.createElement("h2");
      title.textContent = "無法載入商品";

      const detail = document.createElement("p");
      detail.textContent = "錯誤:" + error.message;

      const hint = document.createElement("p");
      hint.textContent = "請確認伺服器已啟動( uvicorn cart.main:app --reload --app-dir src ),並檢查 http://127.0.0.1:8000/docs 是否能開啟,之後重新整理頁面。";

      box.append(title, detail, hint);
      container.appendChild(box);
    }

    // 綁定查詢框:每輸入一個字就依名稱過濾目前頁面的商品
    function bindSearchInput() {
      const input = document.getElementById("search-input");
      input.addEventListener("input", function (event) {
        state.keyword = event.target.value.trim();
        renderProductGrid();
      });
    }

    // 綁定懸浮購物車鈕:點擊後切換到獨立結帳頁
    function bindCartFab() {
      const fab = document.getElementById("cart-fab");
      fab.addEventListener("click", function () {
        openCheckoutView();
      });
    }

    // 綁定結帳頁的「繼續購物」鈕與確認結帳鈕;優惠券清單的點擊由卡片各自綁定
    function bindCheckoutControls() {
      const back = document.getElementById("checkout-back");
      back.addEventListener("click", function () {
        closeCheckoutView();
      });

      const submit = document.getElementById("checkout-submit");
      submit.addEventListener("click", function () {
        submitCheckout();
      });
    }

    // 切換到獨立結帳頁:隱藏目錄、顯示明細,並從後端載入優惠券可選清單
    function openCheckoutView() {
      document.getElementById("catalog").hidden = true;
      document.querySelector("header").hidden = true;
      document.getElementById("checkout-view").hidden = false;
      renderCheckoutItems();
      loadCouponsAndAmounts();
    }

    // 回到目錄頁
    function closeCheckoutView() {
      document.getElementById("catalog").hidden = false;
      document.querySelector("header").hidden = false;
      document.getElementById("checkout-view").hidden = true;
    }

    // 繪出結帳頁左側的購物車明細;空車時顯示提示
    function renderCheckoutItems() {
      const container = document.getElementById("checkout-items");
      container.replaceChildren();

      const productNames = Object.keys(cart);
      if (productNames.length === 0) {
        const empty = document.createElement("p");
        empty.className = "checkout-items__empty";
        empty.textContent = "購物車是空的,請先回到目錄挑選商品";
        container.appendChild(empty);
        return;
      }
      for (const productName of productNames) {
        container.appendChild(buildCheckoutItem(cart[productName]));
      }
    }

    // 組出結帳頁內的單一品項(品名、單價 × 數量、該項小計)
    function buildCheckoutItem(item) {
      const row = document.createElement("div");
      row.className = "checkout-item";

      const info = document.createElement("div");
      const name = document.createElement("div");
      name.className = "checkout-item__name";
      name.textContent = item.name;
      const unit = document.createElement("div");
      unit.className = "checkout-item__unit";
      unit.textContent = item.price + " 元 × " + item.qty;
      info.append(name, unit);

      const lineTotal = document.createElement("div");
      lineTotal.className = "checkout-item__lineTotal";
      lineTotal.textContent = centsToText(priceToCents(item.price) * item.qty) + " 元";

      row.append(info, lineTotal);
      return row;
    }

    // 載入優惠券可選清單,再依目前選項算出結帳金額
    async function loadCouponsAndAmounts() {
      const productNames = Object.keys(cart);
      if (productNames.length === 0) {
        renderCouponOptions([]);
        renderAmountsForEmptyCart();
        return;
      }
      const items = [];
      for (const productName of productNames) {
        items.push({ name: productName, quantity: cart[productName].qty });
      }
      try {
        couponOptions = await fetchCouponOptions(items);
      } catch (error) {
        renderCheckoutError(error);
        return;
      }
      if (!couponOptions.some(function (option) { return option.id === selectedCouponId; })) {
        selectedCouponId = null;
      }
      renderCouponOptions(couponOptions);
      renderCheckoutAmounts();
    }

    // 從後端取得優惠券可選清單(含可用狀態);失敗時拋出錯誤,由呼叫端處理
    async function fetchCouponOptions(items) {
      const response = await fetch("/api/checkout/coupon-options", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: items }),
      });
      if (!response.ok) {
        throw new Error("伺服器回應 HTTP " + response.status);
      }
      return response.json();
    }

    // 組出可點選的優惠券清單:「不使用」+ 後端每一張券;不可用的卡片標灰並附原因
    function renderCouponOptions(options) {
      const container = document.getElementById("coupon-list");
      container.replaceChildren();

      container.appendChild(buildNoCouponCard());
      for (const option of options) {
        container.appendChild(buildCouponCard(option));
      }
    }

    // 「不使用優惠券」選項;空車或後端清單為空時這是唯一可選項
    function buildNoCouponCard() {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "coupon-card";
      if (selectedCouponId === null) {
        button.classList.add("coupon-card--selected");
        button.setAttribute("aria-pressed", "true");
      } else {
        button.setAttribute("aria-pressed", "false");
      }
      button.appendChild(buildCouponName("不使用優惠券"));
      button.appendChild(buildCouponMeta("以促銷後金額結帳"));

      button.addEventListener("click", function () {
        selectedCouponId = null;
        renderCouponOptions(couponOptions);
        renderCheckoutAmounts();
      });
      return button;
    }

    // 單張優惠券卡片;usable 才可點選,其餘停用並標出原因
    function buildCouponCard(option) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "coupon-card";
      button.disabled = option.status !== "usable";
      if (option.id === selectedCouponId) {
        button.classList.add("coupon-card--selected");
        button.setAttribute("aria-pressed", "true");
      } else {
        button.setAttribute("aria-pressed", "false");
      }

      button.appendChild(buildCouponName(option.name));
      button.appendChild(
        buildCouponMeta("滿 " + option.threshold + " 折 " + option.discount + " · 到 " + option.expiry_date)
      );
      button.appendChild(buildCouponStatus(option));

      button.addEventListener("click", function () {
        selectedCouponId = option.id;
        renderCouponOptions(couponOptions);
        renderCheckoutAmounts();
      });
      return button;
    }

    function buildCouponName(text) {
      const span = document.createElement("span");
      span.className = "coupon-card__name";
      span.textContent = text;
      return span;
    }

    function buildCouponMeta(text) {
      const span = document.createElement("span");
      span.className = "coupon-card__meta";
      span.textContent = text;
      return span;
    }

    // 券狀態文字:可使用 / 已過期 / 未達門檻(附門檻金額);只有後端能判斷
    function buildCouponStatus(option) {
      const span = document.createElement("span");
      span.className = "coupon-card__status";
      if (option.status === "expired") {
        span.textContent = "已過期,本次結算無法使用";
      } else if (option.status === "below_threshold") {
        span.textContent = "未達門檻:需促銷後金額滿 " + option.threshold + " 元";
      } else {
        span.textContent = "可使用";
      }
      return span;
    }

    // 依目前購物車與選中的優惠券,向後端要求結算並顯示金額明細
    async function renderCheckoutAmounts() {
      const productNames = Object.keys(cart);
      const submit = document.getElementById("checkout-submit");
      if (productNames.length === 0) {
        renderAmountsForEmptyCart();
        submit.disabled = true;
        return;
      }
      submit.disabled = true;
      showCheckoutStatus("計算中…", false);

      const items = [];
      for (const productName of productNames) {
        items.push({ name: productName, quantity: cart[productName].qty });
      }
      const body = { items: items };
      if (selectedCouponId !== null) {
        body.coupon_id = selectedCouponId;
      }

      try {
        const result = await fetchCheckout(body);
        renderAmounts(result);
        renderCouponNote(result);
        hideCheckoutStatus();
      } catch (error) {
        renderCheckoutError(error);
        return;
      }
      submit.disabled = false;
    }

    // 呼叫後端結算 API;失敗時拋出錯誤,由呼叫端處理
    async function fetchCheckout(body) {
      const response = await fetch("/api/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error("結算失敗(HTTP " + response.status + "):" + detail);
      }
      return response.json();
    }

    // 空車時把金額區清空,只保留合計為 0,並清掉優惠券清單
    function renderAmountsForEmptyCart() {
      document.getElementById("amount-list").replaceChildren();
      const total = document.getElementById("amount-total");
      total.replaceChildren();
      const label = document.createElement("span");
      label.textContent = "結算金額";
      const value = document.createElement("span");
      value.textContent = "0.00 元";
      total.append(label, value);
      const note = document.getElementById("coupon-note");
      note.textContent = "";
      note.className = "coupon-note";
      couponOptions = [];
      selectedCouponId = null;
      renderCouponOptions([]);
    }

    // 繪出後端回傳的金額明細:原價、促銷折扣、優惠券折扣、結算金額
    function renderAmounts(result) {
      const list = document.getElementById("amount-list");
      list.replaceChildren();

      list.appendChild(buildAmountRow("原價合計", result.original_subtotal, false));

      const promotionDiscount = subtractAmounts(result.original_subtotal, result.promoted_subtotal);
      if (promotionDiscount !== "0.00") {
        for (const promotionName of result.applied_promotion_names) {
          list.appendChild(buildAmountRow("促銷:" + promotionName, "−" + promotionDiscount, true));
        }
      }

      if (result.coupon_discount !== "0.00") {
        const couponName = result.applied_coupon_name || "優惠券";
        list.appendChild(buildAmountRow("優惠券:" + couponName, "−" + result.coupon_discount, true));
      }

      const total = document.getElementById("amount-total");
      total.replaceChildren();
      const totalLabel = document.createElement("span");
      totalLabel.textContent = "結算金額";
      const totalValue = document.createElement("span");
      totalValue.textContent = result.total + " 元";
      total.append(totalLabel, totalValue);
    }

    // 組出金額明細的單一行(標籤 + 金額)
    function buildAmountRow(label, value, isDiscount) {
      const row = document.createElement("li");
      if (isDiscount) {
        row.className = "amount-list__row amount-list__row--promotion";
      } else {
        row.className = "amount-list__row";
      }
      const labelSpan = document.createElement("span");
      labelSpan.textContent = label;
      const valueSpan = document.createElement("span");
      valueSpan.textContent = value + " 元";
      row.append(labelSpan, valueSpan);
      return row;
    }

    // 用整數分相減兩個金額字串,避免 float 小數誤差
    function subtractAmounts(minuend, subtrahend) {
      return centsToText(priceToCents(minuend) - priceToCents(subtrahend));
    }

    // 依後端回傳的券狀態,在清單下方顯示提示(未達門檻或已過期時警示)
    function renderCouponNote(result) {
      const note = document.getElementById("coupon-note");
      note.className = "coupon-note";
      if (result.coupon_status === "below_threshold") {
        note.textContent = "優惠券未達門檻:需促銷後金額滿 " + thresholdOfSelectedCoupon() + " 元";
        note.classList.add("coupon-note--warn");
        return;
      }
      if (result.coupon_status === "expired") {
        note.textContent = "優惠券已過期,本次結算未折抵";
        note.classList.add("coupon-note--warn");
        return;
      }
      note.textContent = "每次結算只能使用一張優惠券";
    }

    // 查詢目前選中券的門檻,用於未達門檻的提示文字
    function thresholdOfSelectedCoupon() {
      for (const option of couponOptions) {
        if (option.id === selectedCouponId) {
          return option.threshold;
        }
      }
      return "";
    }

    // 顯示結帳頁下方的狀態列(成功或錯誤訊息)
    function showCheckoutStatus(message, isError) {
      const status = document.getElementById("checkout-status");
      status.textContent = message;
      status.hidden = false;
      if (isError) {
        status.className = "checkout-status checkout-status--error";
      } else {
        status.className = "checkout-status";
      }
    }

    function hideCheckoutStatus() {
      const status = document.getElementById("checkout-status");
      status.hidden = true;
    }

    // 結帳頁的載入或結算失敗:顯示錯誤與排除方式
    function renderCheckoutError(error) {
      showCheckoutStatus(
        "無法完成結算:" + error.message + "。請確認伺服器已啟動( uvicorn cart.main:app --reload --app-dir src )後重試。",
        true
      );
      document.getElementById("checkout-submit").disabled = true;
    }

    // 確認結帳:金額已由後端算出,這裡只顯示結果並清空購物車
    function submitCheckout() {
      const totalText = document.getElementById("amount-total").textContent.trim();
      showCheckoutStatus("結帳完成," + totalText + ",感謝您的購買!", false);

      for (const productName of Object.keys(cart)) {
        delete cart[productName];
      }
      renderCartBadge();
      renderCheckoutItems();
      renderAmountsForEmptyCart();
      document.getElementById("checkout-submit").disabled = true;
    }

    // 頁面載入後立即執行的主流程
    async function main() {
      const grid = document.getElementById("product-grid");
      bindSearchInput();
      bindCartFab();
      bindCheckoutControls();
      renderCartBadge();
      try {
        const groups = await fetchProducts();
        const flattened = flattenProducts(groups);
        state.allProducts = flattened.allProducts;
        state.categoryNames = flattened.categoryNames;
        renderCategoryTabs();
        renderProductGrid();
      } catch (error) {
        renderError(grid, error);
      }
    }

    main();
  </script>
</body>
</html>
